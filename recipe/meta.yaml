{% set name = "kramdown" %}
{% set version = "2.6.1" %}

package:
  name: rb-{{ name|lower }}
  version: {{ version }}

source:
  url: https://rubygems.org/downloads/{{ name }}-{{ version }}.gem
  sha256: fbef3479b69c875aacb118dde77a40d6cc3a91e2c1d505a4c3f3f9e92d142641

build:
  noarch: generic
  number: 0
  script:
    - gem install -N -l -V --norc --ignore-dependencies {{ name }}-{{ version }}.gem
    - gem unpack {{ name }}-{{ version }}.gem

requirements:
  host:
    - ruby
  run:
    - {{ pin_compatible('ruby', max_pin='x.x') }}
    - rb-rexml >=0

test:
  commands:
    - ruby -r {{ name }} -e 'exit 0'

about:
  home: https://rubygems.org/gems/kramdown
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: kramdown is yet-another-markdown-parser

  doc_url: http://kramdown.gettalong.org/rdoc
  dev_url: http://github.com/gettalong/kramdown

extra:
  recipe-maintainers:
    - sodre
    - jdmarques
